<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主持人後台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
  background: #0f0c29; color: #fff;
  min-height: 100vh; padding: 24px;
}
.wrap { max-width: 960px; margin: 0 auto; }
h1 { font-size: 1.6rem; margin-bottom: 20px; }
h2 { font-size: 1.05rem; color: #c084fc; margin-bottom: 12px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media(max-width:620px){ .grid2{ grid-template-columns:1fr; } }

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; padding: 20px;
}

.btn {
  padding: 9px 18px; border-radius: 10px; border: none;
  font-size: 0.95rem; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s; white-space: nowrap;
}
.btn:hover { opacity: 0.82; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-purple { background: linear-gradient(135deg,#e056fd,#7c6ff7); color:#fff; }
.btn-green  { background: #6ab04c; color:#fff; }
.btn-red    { background: #eb4d4b; color:#fff; }
.btn-gray   { background: rgba(255,255,255,0.15); color:#fff; }

input, select, textarea {
  width: 100%; padding: 9px 13px;
  border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.07); color: #fff;
  font-size: 0.92rem; outline: none; margin-bottom: 8px;
}
input:focus, select:focus, textarea:focus { border-color: #e056fd; }
select option { background: #1a1a2e; }
textarea { resize: none; }

.qr-center { text-align: center; }
.qr-center img { width: 160px; border-radius: 12px; margin-bottom: 8px; }
.qr-url { font-size: 0.78rem; color: #a78bfa; word-break: break-all; }

.stat-big { font-size: 3.2rem; font-weight: 800; color: #f9ca24; line-height: 1; }
.stat-label { font-size: 0.85rem; opacity: 0.6; margin-bottom: 14px; }

.phase-tag {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 0.82rem; font-weight: 600; margin-bottom: 12px;
}
.ph-lobby    { background: #1289A7; }
.ph-starting { background: #7c6ff7; }
.ph-question { background: #6ab04c; }
.ph-reveal   { background: #f9ca24; color: #333; }
.ph-finished { background: #eb4d4b; }

.ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; }

.q-list { list-style: none; max-height: 320px; overflow-y: auto; }
.q-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; margin-bottom: 6px;
  background: rgba(255,255,255,0.07); border-radius: 10px;
}
.q-num { font-weight: 700; color: #c084fc; min-width: 22px; padding-top: 2px; }
.q-body { flex: 1; }
.q-title { font-size: 0.9rem; margin-bottom: 4px; }
.q-ans { font-size: 0.78rem; color: #6ab04c; }
.q-del { background: none; border: none; color: #eb4d4b; cursor: pointer; font-size: 1rem; padding: 2px; }

.opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 50px;
  font-weight: 600; font-size: 0.9rem;
  display: none; z-index: 99; color: #fff;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 主持人後台</h1>

  <div class="grid2">
    <!-- QR Code -->
    <div class="card">
      <h2>掃碼加入</h2>
      <div class="qr-center">
        <img id="qr-img" src="" alt="QR Code">
        <div class="qr-url" id="qr-url">載入中...</div>
      </div>
    </div>

    <!-- 狀態 + 控制 -->
    <div class="card">
      <h2>遊戲狀態</h2>
      <div class="stat-big" id="p-count">0</div>
      <div class="stat-label">人已加入</div>
      <div class="phase-tag ph-lobby" id="phase-tag">等待中</div>
      <div style="font-size:0.85rem;opacity:0.6;margin-bottom:12px" id="q-prog-host"></div>
      <div class="ctrl-row">
        <button class="btn btn-green" id="btn-start" onclick="hostStart()">▶ 開始遊戲</button>
        <button class="btn btn-purple" id="btn-next" onclick="hostNext()" disabled>下一題 →</button>
        <button class="btn btn-gray" onclick="hostReset()">↺ 重置</button>
      </div>
    </div>
  </div>

  <!-- 一鍵載入預設題目 -->
  <div class="card" style="margin-bottom:16px">
    <h2>快速載入</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn btn-purple" onclick="loadPreset()">🎉 歡送會基本 15 題</button>
      <button class="btn btn-purple" onclick="loadInteractive()">🧠 互動趣味 15 題</button>
      <button class="btn btn-purple" onclick="loadBlessings()">💛 祝福傳承 15 題</button>
      <button class="btn btn-purple" onclick="loadFireDrill()">🚒 防火演練 10 題</button>
    </div>
    <span style="font-size:0.8rem;opacity:0.5">點完記得按「💾 儲存並更新」</span>
  </div>

  <!-- 匯入玩家名單 -->
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">玩家名單</h2>
      <div id="mode-badge" style="font-size:0.8rem;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,0.12)">匿名模式</div>
    </div>
    <div style="font-size:0.82rem;opacity:0.55;margin-bottom:10px">
      匯入名單後切換為「名單模式」：玩家需輸入學號才能加入，不在名單內的人無法登入。<br>
      清除名單後回到「匿名模式」：玩家自行輸入暱稱加入。
    </div>
    <textarea id="roster-input" rows="5" placeholder="貼上名單，每行一筆（學號 姓名），支援空格、Tab 或逗號分隔&#10;&#10;範例：&#10;B12345678	王小明&#10;B23456789	李大華"></textarea>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-purple" onclick="importRoster()">📋 匯入名單（切名單模式）</button>
      <button class="btn btn-gray" onclick="clearRoster()">✕ 清除名單（回匿名模式）</button>
      <span id="roster-status" style="font-size:0.85rem;color:#6ab04c"></span>
    </div>
  </div>

  <!-- 新增題目 -->
  <div class="card" style="margin-bottom:16px">
    <h2>新增題目</h2>
    <textarea id="q-text-input" rows="2" placeholder="題目內容"></textarea>
    <div class="opts-grid">
      <input id="opt-0" placeholder="A 選項">
      <input id="opt-1" placeholder="B 選項">
      <input id="opt-2" placeholder="C 選項">
      <input id="opt-3" placeholder="D 選項">
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <select id="correct-sel" style="margin-bottom:0">
        <option value="0">✅ A 正確</option>
        <option value="1">✅ B 正確</option>
        <option value="2">✅ C 正確</option>
        <option value="3">✅ D 正確</option>
      </select>
      <button class="btn btn-purple" onclick="addQuestion()">＋ 新增</button>
    </div>
  </div>

  <!-- 題目列表 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">題目列表（<span id="q-count">0</span> 題）</h2>
      <button class="btn btn-green" onclick="saveQuestions()">💾 儲存並更新</button>
    </div>
    <ul class="q-list" id="q-list"></ul>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let questions = [];
let phase = 'lobby';
let playerCount = 0;

function updateStartBtn() {
  document.getElementById('btn-start').disabled = phase !== 'lobby' || playerCount === 0;
}

socket.on('connect', () => socket.emit('host_sync'));
socket.on('host_state', ({ phase: p, currentQ, total, playerCount: pc, rosterCount }) => {
  playerCount = pc;
  setPhase(p);
  document.getElementById('p-count').textContent = pc;
  if (currentQ >= 0 && total > 0)
    document.getElementById('q-prog-host').textContent = `第 ${currentQ+1} 題 ／ 共 ${total} 題`;
  const badge = document.getElementById('mode-badge');
  if (rosterCount > 0) {
    document.getElementById('roster-status').textContent = `✅ 已匯入 ${rosterCount} 人`;
    badge.textContent = '名單模式';
    badge.style.background = 'rgba(106,176,76,0.3)';
  } else {
    badge.textContent = '匿名模式';
    badge.style.background = 'rgba(255,255,255,0.12)';
  }
});

function toast(msg, color = '#6ab04c') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = color;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}

function setPhase(p) {
  phase = p;
  const tag = document.getElementById('phase-tag');
  const map = {
    lobby:    ['等待中',   'ph-lobby'],
    starting: ['即將開始', 'ph-starting'],
    question: ['答題中',   'ph-question'],
    reveal:   ['答案揭曉', 'ph-reveal'],
    finished: ['遊戲結束', 'ph-finished'],
  };
  const [label, cls] = map[p] || ['等待中','ph-lobby'];
  tag.textContent = label;
  tag.className = 'phase-tag ' + cls;
  document.getElementById('btn-next').disabled  = p !== 'reveal';
  updateStartBtn();
}

function renderQuestions() {
  document.getElementById('q-count').textContent = questions.length;
  const optLetters = ['A','B','C','D'];
  document.getElementById('q-list').innerHTML = questions.map((q, i) => `
    <li class="q-item">
      <span class="q-num">${i+1}</span>
      <div class="q-body">
        <div class="q-title">${q.text}</div>
        <div class="q-ans">正解：${optLetters[q.correctIndex]}. ${q.options[q.correctIndex]}</div>
      </div>
      <button class="q-del" onclick="delQ(${i})">✕</button>
    </li>
  `).join('');
}

function addQuestion() {
  const text = document.getElementById('q-text-input').value.trim();
  const opts = [0,1,2,3].map(i => document.getElementById(`opt-${i}`).value.trim());
  const correct = parseInt(document.getElementById('correct-sel').value);
  if (!text || opts.some(o => !o)) {
    toast('請填寫題目和全部四個選項', '#eb4d4b'); return;
  }
  questions.push({ text, options: opts, correctIndex: correct });
  renderQuestions();
  document.getElementById('q-text-input').value = '';
  [0,1,2,3].forEach(i => document.getElementById(`opt-${i}`).value = '');
  toast('✅ 已新增');
}

function delQ(i) {
  questions.splice(i, 1);
  renderQuestions();
}

function saveQuestions() {
  if (!questions.length) { toast('請先新增題目', '#eb4d4b'); return; }
  socket.emit('host_set_questions', questions);
}

function hostStart() {
  if (!questions.length) { toast('請先儲存題目', '#eb4d4b'); return; }
  socket.emit('host_start');
}
function hostNext() { socket.emit('host_next'); }
const PRESET_QUESTIONS = [
  { text: "如果把研究所生活比喻成一個資訊系統，最常出現的錯誤訊息會是？", options: ["系統忙碌中，請稍後再試", "權限不足，請聯絡教授", "記憶體不足，請先睡覺", "資料尚未完成，請補交報告"], correctIndex: 3 },
  { text: "資管職碩生最需要的「雲端服務」是什麼？", options: ["Google Drive", "iCloud", "教授的慈悲雲", "截止日前自動完成報告雲"], correctIndex: 2 },
  { text: "下列哪一項最像職碩生的日常資料流程？", options: ["收集資料 → 分析資料 → 完成報告", "開會 → 加班 → 寫作業 → 懷疑人生", "訂便當 → 討論分組 → 忘記交檔案", "以上皆是"], correctIndex: 3 },
  { text: "在資訊管理中，「資料治理」很重要；在職碩生活中，最需要治理的是什麼？", options: ["電腦硬碟", "LINE 群組訊息", "睡眠時間", "報告版本：final、final2、final最新版"], correctIndex: 3 },
  { text: "如果用 AI 來協助寫論文或報告，最重要的能力是？", options: ["讓 AI 幫你全部寫完", "會問好問題，也會判斷答案對不對", "把所有內容都複製貼上", "只要有摘要就好"], correctIndex: 1 },
  { text: "職碩班最常見的「系統整合」情境是？", options: ["ERP 串接 CRM", "公司工作串接家庭生活", "課堂報告串接期末專案", "以上皆是"], correctIndex: 3 },
  { text: "如果把同學群組當成一個企業系統，誰最像「系統管理員」？", options: ["永遠第一個提醒交作業的人", "永遠負責開 Google Meet 的人", "永遠找得到檔案連結的人", "以上都是"], correctIndex: 3 },
  { text: "下列哪個最符合「敏捷開發」在職碩班的真實應用？", options: ["每週固定衝刺進度", "每次開會都有清楚待辦", "截止日前 48 小時突然爆發戰鬥力", "持續交付高品質睡眠"], correctIndex: 2 },
  { text: "歡送會中最需要備份的是什麼？", options: ["照片", "影片", "祝福語", "今天大家還很清醒時的記憶"], correctIndex: 3 },
  { text: "如果教授是資料庫，最常被學生查詢的是？", options: ["成績什麼時候出來", "報告格式可不可以放寬", "這題會不會考", "老師，這樣可以嗎？"], correctIndex: 3 },
  { text: "對職碩生來說，最像「高可用性架構」的是？", options: ["電腦不當機", "網路不卡", "咖啡、宵夜、同學支援永不中斷", "雲端硬碟自動同步"], correctIndex: 2 },
  { text: "畢業後最希望自己的人生系統升級成哪個版本？", options: ["工作穩定版", "薪水更新版", "睡眠修復版", "以上全部安裝"], correctIndex: 3 },
  { text: "下列哪一項最像職碩班的「專案風險」？", options: ["組員已讀不回", "老闆臨時交辦工作", "期末報告遇到公司加班", "以上皆是"], correctIndex: 3 },
  { text: "如果人生是一個儀表板 Dashboard，畢業後最想看到哪個指標上升？", options: ["存款餘額", "睡眠時數", "職涯成長", "幸福感"], correctIndex: 3 },
  { text: "對即將畢業的同學來說，最適合的一句資訊管理式祝福是？", options: ["願你的人生資料永遠完整備份", "願你的職涯系統穩定擴充", "願你的決策都有高品質資料支援", "以上都是，並且持續最佳化"], correctIndex: 3 },
];

const INTERACTIVE_QUESTIONS = [
  { text: "資管職碩生最常見的「系統錯誤」是？", options: ["腦袋 404 Not Found", "Wi-Fi 斷線", "Excel 當掉", "投影機找不到訊號"], correctIndex: 0, explanation: "職碩生常常工作、上課、報告一起來，忙到腦袋直接找不到資料。" },
  { text: "如果職碩生活是一套 ERP，最難整合的是哪個模組？", options: ["課業模組", "工作模組", "睡眠模組", "家庭模組"], correctIndex: 2, explanation: "工作、課業、家庭都要顧，最後最常被犧牲的就是睡眠。" },
  { text: "下列哪一個最像職碩生的「資料備份策略」？", options: ["存在電腦", "傳給最可靠的組員，然後大家都找他", "存在雲端", "傳到群組"], correctIndex: 1, explanation: "最安全的備份不是雲端，是那位永遠找得到檔案的神隊友。" },
  { text: "資管職碩班最常見的「專案管理工具」其實是？", options: ["Trello", "LINE 群組裡的「已讀」壓力", "Jira", "Asana"], correctIndex: 1, explanation: "比起正式工具，LINE 群組的已讀和提醒更有催進度的效果。" },
  { text: "如果教授是資料庫，學生最常下的查詢語句是？", options: ["SELECT 可以晚點交嗎 FROM 老師", "SELECT * FROM 分數", "SELECT * FROM 考試範圍", "SELECT * FROM 作業期限"], correctIndex: 0, explanation: "這是學生最真實的心聲，尤其期限快到的時候最想查這個答案。" },
  { text: "職碩生最強的 AI Prompt 通常是？", options: ["請幫我整理文獻", "請幫我做摘要", "請幫我把「還沒開始」包裝成「目前正在規劃中」", "請幫我翻譯成英文"], correctIndex: 2, explanation: "職碩生很懂專業表達，連進度落後都要講得很有策略感。" },
  { text: "下列哪個最符合「敏捷開發」在職碩班的真實精神？", options: ["每週固定 Sprint", "Deadline 前一天，全組突然變敏捷", "每天站立會議", "持續交付價值"], correctIndex: 1, explanation: "真正的敏捷常常不是每天 Sprint，而是期限前戰鬥力突然爆發。" },
  { text: "資管職碩生最常用的「雲端運算」是？", options: ["AWS", "Google Cloud", "老師還沒點名，趕快雲端連線進教室", "Azure"], correctIndex: 2, explanation: "這裡的雲端不是技術，而是人還沒到、靈魂先上線。" },
  { text: "下列哪一項最像職碩班的「風險管理」？", options: ["先問：「大家這週有空嗎？」然後沒人回", "先排進度", "先開共用資料夾", "先分工"], correctIndex: 0, explanation: "分組最大的風險，往往不是題目太難，而是大家時間永遠對不上。" },
  { text: "如果同學群組是一個資訊系統，最重要的功能是？", options: ["檔案共享", "即時通知", "在教授宣布作業後，集體沉默 3 分鐘", "權限管理"], correctIndex: 2, explanation: "這種沉默代表大家都收到訊息了，只是還在消化現實。" },
  { text: "職碩生最常見的「版本控管」是？", options: ["GitHub", "GitLab", "SVN", "報告_final、報告_final2、報告_真的最終版、報告_拜託用這版"], correctIndex: 3, explanation: "這是最經典的學生版版本控管，每一版都說是最後一版。" },
  { text: "畢業後最想升級的人生系統功能是？", options: ["自動加薪", "自動準時下班", "自動睡滿 8 小時", "自動拒絕不合理需求"], correctIndex: 0, explanation: "畢業後最希望努力能被看見，最實際的升級就是薪水也跟著升級。" },
  { text: "資管職碩生最像哪一種資料庫？", options: ["關聯式資料庫，資料整齊到不行", "NoSQL 資料庫，什麼格式都能塞", "壓力越大，資料越亂的資料庫", "雲端資料庫，永遠在線"], correctIndex: 2, explanation: "平常還算有條理，但只要報告、工作、期末一起來，資料就開始失控。" },

  { text: "對畢業生最適合的資管式祝福是？", options: ["願你的人生系統永不當機", "願你的職涯資料永遠正規化", "願你未來的老闆都比教授好溝通", "願你的薪水持續版本更新"], correctIndex: 3, explanation: "用資管人的語言祝福畢業生，希望未來職涯越來越好，薪水也不斷升級。" },

function importRoster() {
  const text = document.getElementById('roster-input').value.trim();
  if (!text) { toast('請貼上名單內容', '#eb4d4b'); return; }
  const roster = {};
  text.split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    // 支援空格、Tab、逗號分隔；第一欄學號，其餘為姓名
    const parts = line.split(/[\t,，]+|(?<=\S)\s+/);
    if (parts.length >= 2) {
      const id = parts[0].trim();
      const name = parts.slice(1).join('').trim();
      if (id && name) roster[id] = name;
    }
  });
  const count = Object.keys(roster).length;
  if (count === 0) { toast('解析失敗，請確認格式', '#eb4d4b'); return; }
  socket.emit('host_set_roster', roster);
}

function clearRoster() {
  socket.emit('host_clear_roster');
  document.getElementById('roster-input').value = '';
}

function hostReset() {
  if (!confirm('確定重置？所有分數清零。')) return;
  socket.emit('host_reset');
}

fetch('/api/qrcode').then(r => r.json()).then(d => {
  document.getElementById('qr-img').src = d.qr;
  document.getElementById('qr-url').textContent = d.url;
});

socket.on('questions_saved', n => toast(`✅ 已儲存 ${n} 題`));
socket.on('roster_saved', n => {
  document.getElementById('roster-status').textContent = n > 0 ? `✅ 已匯入 ${n} 人` : '名單已清除';
  document.getElementById('mode-badge').textContent = n > 0 ? '名單模式' : '匿名模式';
  document.getElementById('mode-badge').style.background = n > 0 ? 'rgba(106,176,76,0.3)' : 'rgba(255,255,255,0.12)';
  toast(n > 0 ? `✅ 匯入 ${n} 位學生，已切換名單模式` : '已清除名單，回到匿名模式');
});
socket.on('player_count', n => {
  playerCount = n;
  document.getElementById('p-count').textContent = n;
  updateStartBtn();
});
socket.on('game_starting', () => setPhase('starting'));
socket.on('question_start', data => {
  setPhase('question');
  document.getElementById('q-prog-host').textContent =
    `第 ${data.index+1} 題 ／ 共 ${data.total} 題`;
});
socket.on('answer_progress', ({ answered, total }) => {
  if (phase === 'question') {
    document.getElementById('q-prog-host').textContent =
      document.getElementById('q-prog-host').textContent.replace(/ — .*/, '') +
      ` — ${answered}/${total} 人作答`;
  }
});
socket.on('question_reveal', () => setPhase('reveal'));
socket.on('game_over', () => setPhase('finished'));
socket.on('game_reset', () => {
  setPhase('lobby');
  document.getElementById('q-prog-host').textContent = '';
});
